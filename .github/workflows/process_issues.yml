name: Process GitHub Issues (Disabled)

# Disabled automatically on issue create/edit per user configuration
on:
  workflow_dispatch: # Manual execution only if triggered manually

jobs:
  process-issues:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process GitHub Open Issues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI_APIKEY || secrets.GEMINI_SECRET }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/process_github_issues.py

      - name: Commit and push Job changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Job/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Job plan and task docs from GitHub issues [skip ci]" && git push)
