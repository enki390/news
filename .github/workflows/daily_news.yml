name: Daily News Aggregator Batch

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at 09:00 KST (UTC 00:00) on GitHub Cloud
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - apply_feedback

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process GitHub Open Issues and Run news collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI_APIKEY || secrets.GEMINI_SECRET }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          COLLECT_MODE: ${{ inputs.mode }}
        run: |
          python scripts/process_github_issues.py
          python scripts/collector.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ Job/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update news batch and Job logs [skip ci]" && git push)
