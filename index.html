<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS DISCOVER | Sleek AI 뉴스 헤드라인 디스커버</title>
  <meta name="description" content="경제, 세계, IT/과학 3대 핵심 카테고리의 언론사 헤드라인을 모아 AI로 기승전결 분석, 관점 비교, 용어 풀이 및 파급 효과를 정리해 드립니다.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="index.css?v=20260726_02">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <div class="container header-content">
      <a href="#" class="logo-group" id="logoLink">
        <div class="logo-icon">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="logo-text-block">
          <span class="logo-title">NEWS DISCOVER</span>
          <span class="logo-subtitle">Sleek AI News Aggregator</span>
        </div>
      </a>

      <div class="header-controls">
        <!-- Date Selector with Custom Calendar Popover -->
        <div class="date-selector-wrapper">
          <button class="control-badge date-picker-trigger" id="datePickerTrigger" title="뉴스 날짜 선택 및 달력 열기">
            <i class="fa-regular fa-calendar-check"></i>
            <span id="selectedDateText">2026-07-26</span>
            <i class="fa-solid fa-chevron-down arrow-icon"></i>
          </button>

          <!-- Custom Interactive Calendar Popover -->
          <div class="calendar-popover" id="calendarPopover" aria-hidden="true">
            <div class="calendar-header">
              <button class="cal-nav-btn" id="calPrevMonthBtn" title="이전 달">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <span class="cal-month-title" id="calMonthTitle">2026년 7월</span>
              <button class="cal-nav-btn" id="calNextMonthBtn" title="다음 달">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
            <div class="calendar-weekdays">
              <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
            </div>
            <div class="calendar-days-grid" id="calendarDaysGrid">
              <!-- Dynamically rendered via app.js -->
            </div>
            <div class="calendar-footer">
              <div class="legend-item">
                <span class="legend-dot available-dot"></span>
                <span>데이터 있음 (클릭 가능)</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot disabled-dot"></span>
                <span>데이터 없음</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" placeholder="뉴스 키워드 검색...">
        </div>

        <!-- Theme Toggle Button -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="테마 변경 (Dark / Light)">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    
    <!-- Hero Banner -->
    <section class="hero-section">
      <div class="hero-header">
        <div>
          <h1 class="hero-title">실시간 주요 뉴스 AI 디스커버</h1>
          <p class="hero-subtitle" id="mainHeroSubtitle">경제, 세계, IT/과학 3대 카테고리의 헤드라인을 AI가 기승전결로 종합 분석하고 언론사별 관점, 용어 풀이, 파급 효과를 정리해 드립니다.</p>
        </div>
        <div class="update-tag" id="updateTag">
          <div class="pulse-dot"></div>
          <span id="updateTimeText">매일 06:00 KST 수집</span>
        </div>
      </div>

      <!-- Category Filter Chips (경제, 세계, IT/과학) -->
      <nav class="category-bar" id="categoryBar" aria-label="뉴스 카테고리 필터">
        <button class="category-chip active" data-category="all">
          <i class="fa-solid fa-layer-group"></i> 전체
        </button>
        <button class="category-chip" data-category="경제">
          <i class="fa-solid fa-chart-line"></i> 경제
        </button>
        <button class="category-chip" data-category="세계">
          <i class="fa-solid fa-earth-americas"></i> 세계
        </button>
        <button class="category-chip" data-category="IT/과학">
          <i class="fa-solid fa-microchip"></i> IT/과학
        </button>
      </nav>
    </section>

    <!-- News Cards Grid Container -->
    <section id="newsContainer" class="news-grid">
      <!-- Dynamically Rendered via app.js -->
      <div class="loading-state">
        <div class="spinner"></div>
        <p>카테고리별 주요 뉴스를 불러오는 중입니다...</p>
      </div>
    </section>

  </main>

  <!-- News Detail Modal Overlay -->
  <div class="modal-overlay" id="newsModal" role="dialog" aria-modal="true">
    <div class="modal-container">
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="닫기">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="modal-body" id="modalBody">
        <!-- Dynamically Rendered Modal Content -->
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script src="app.js"></script>
</body>
</html>
